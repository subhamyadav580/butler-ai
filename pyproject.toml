[project]
name = "butler"
version = "0.1.0"
description = "A self-hosted personal AI assistant for Gmail and Swiggy, on the web, Telegram or the terminal, built with LangGraph."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2",
    "langchain-core>=1.6",
    "langchain-openai>=1.6",
    "langchain-mcp-adapters>=0.3",
    "mcp>=1.30",
    "python-telegram-bot>=22",
    "python-dotenv>=1.0",
    "google-api-python-client>=2.200",
    "google-auth-oauthlib>=1.5",
    "google-auth-httplib2>=0.4",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2",
    "rich>=13",
    "prompt-toolkit>=3",
    "uvicorn>=0.30",
]

[project.scripts]
butler = "butler.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["butler*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Pyflakes (unused/undefined names), syntax errors, bugbear, pyupgrade, simplify
select = ["F", "E9", "B", "UP", "SIM"]
ignore = [
    "B008",    # FastAPI's `param = Depends(...)` defaults are intentional
    "UP007",   # keep Optional[...] for readability
    "UP045",
    "UP035",
    "SIM108",  # don't force ternaries
]
